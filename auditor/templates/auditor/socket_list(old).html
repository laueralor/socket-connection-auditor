<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Socket Connection Auditor</title>
    <style>
        table { width: 100%; border-collapse: collapse; font-family: sans-serif; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #f4f4f4; }
        .state-listen { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <h1>System Socket Inventory</h1>
    <table>
        <thead>
            <tr>
                <th>Protocol</th>
                <th>State</th>
                <th>Local Address:Port</th>
                <th>Peer Address:Port</th>
                <th>Process Info</th>
            </tr>
        </thead>
        <tbody>
            {% for s in sockets %}
            <tr>
                <td>{{ s.netid }}</td>
                <td class="{% if s.state == 'LISTEN' %}state-listen{% endif %}">{{ s.state }}</td>
                <td>{{ s.local }}</td>
                <td>{{ s.peer }}</td>
                <td>{{ s.process }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
