<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Socket Connection Auditor{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --app-bg: #f3f6fb;
            --app-surface: #ffffff;
            --app-dark: #0f172a;
            --app-muted: #64748b;
            --app-border: #e2e8f0;
            --app-primary: #2563eb;
            --app-shadow: 0 18px 45px rgba(15, 23, 42, 0.10);
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(37, 99, 235, 0.16), transparent 32rem),
                radial-gradient(circle at top right, rgba(14, 165, 233, 0.14), transparent 30rem),
                var(--app-bg);
            color: var(--app-dark);
        }

        .app-navbar {
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .brand-mark {
            width: 40px;
            height: 40px;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            color: white;
            box-shadow: 0 10px 26px rgba(37, 99, 235, 0.35);
        }

        .brand-subtitle {
            color: #94a3b8;
            font-size: 0.78rem;
        }

        .content-wrapper {
            padding-top: 2rem;
            padding-bottom: 3rem;
        }

        .hero-card,
        .metric-card,
        .control-card,
        .table-card {
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 1.35rem;
            box-shadow: var(--app-shadow);
        }

        .hero-card {
            position: relative;
            overflow: hidden;
        }

        .hero-card::after {
            content: "";
            position: absolute;
            right: -5rem;
            bottom: -8rem;
            width: 19rem;
            height: 19rem;
            border-radius: 999px;
            background: rgba(37, 99, 235, 0.10);
            pointer-events: none;
        }

        .hero-title {
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .text-muted-app {
            color: var(--app-muted);
        }

        .metric-icon {
            width: 46px;
            height: 46px;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #eff6ff;
            color: var(--app-primary);
            font-size: 1.25rem;
        }

        .metric-value {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .small-label {
            font-size: 0.76rem;
            color: var(--app-muted);
            text-transform: uppercase;
            letter-spacing: 0.07em;
            font-weight: 700;
        }

        .form-control,
        .form-select {
            border-color: var(--app-border);
            border-radius: 0.9rem;
        }

        .input-group-text {
            border-color: var(--app-border);
            border-radius: 0.9rem 0 0 0.9rem;
            background: #f8fafc;
        }

        .btn {
            border-radius: 0.85rem;
            font-weight: 600;
        }

        .table-card {
            overflow: hidden;
        }

        .table {
            margin-bottom: 0;
        }

        .table thead th {
            background: #0f172a;
            color: white;
            border-bottom: 0;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        .table tbody td {
            vertical-align: middle;
            border-color: #eef2f7;
        }

        .table-hover tbody tr:hover {
            background-color: #f8fafc;
        }

        .sort-button {
            border: 0;
            background: transparent;
            color: inherit;
            font: inherit;
            padding: 0;
            text-transform: inherit;
            letter-spacing: inherit;
        }

        .sort-button:hover {
            text-decoration: underline;
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.9rem;
        }

        .live-dot {
            width: 0.65rem;
            height: 0.65rem;
            border-radius: 999px;
            background: #94a3b8;
            display: inline-block;
        }

        .live-dot.active {
            background: #22c55e;
            box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.18);
        }

        .empty-state {
            border: 1px dashed #cbd5e1;
            border-radius: 1rem;
            background: #f8fafc;
        }

        .status-pill {
            font-size: 0.78rem;
            padding: 0.45rem 0.65rem;
            border-radius: 999px;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-3" href="/sockets/">
                <span class="brand-mark">
                    <i class="bi bi-hdd-network"></i>
                </span>
                <span>
                    <span class="d-block fw-bold">Socket Connection Auditor</span>
                    <span class="brand-subtitle d-none d-sm-block">Network socket monitoring dashboard</span>
                </span>
            </a>
        </div>
    </nav>

    <main class="container content-wrapper">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
